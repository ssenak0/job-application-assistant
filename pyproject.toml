[project]
name = "job-application-assistant"
version = "0.1.0"
description = "Local-first human-approved job application assistant."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "jinja2>=3.1",
  "pydantic>=2.7",
  "pypdf>=4.0",
  "reportlab>=4.0",
  "typer>=0.12",
  "uvicorn>=0.29"
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
job-assistant = "app.cli:app"

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["data*", "outputs*", "tests*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
